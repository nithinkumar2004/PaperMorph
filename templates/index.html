<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>PaperMorph - PDF to DOCX Converter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            transition: background 0.3s ease;
        }

        .container {
            margin-top: 50px;
        }

        .card {
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        #file-preview {
            border: 1px solid #ddd;
            margin-top: 10px;
            height: 500px;
            width: 100%;
            border-radius: 10px;
        }

        .theme-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="theme-switch">
        <button id="toggleTheme" class="btn btn-outline-secondary">Dark Mode</button>
    </div>

    <div class="container d-flex justify-content-center">
        <div class="card p-4 col-md-8">
            <header class="text-center mb-4">
                <h1 class="display-5 fw-bold" style="letter-spacing: 1px;">📝 PaperMorph</h1>
                <p class="text-muted">Seamlessly morph your PDFs into editable DOCX files</p>
            </header>

            {% if success %}
            <div class="alert alert-success text-center">
                ✅ Conversion Successful! <a href="{{ url_for('download_file', filename=converted_file) }}" class="alert-link">Download DOCX</a>
            </div>
            {% endif %}

            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="alert alert-danger text-center">
                {% for message in messages %}
                <p>{{ message }}</p>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="pdf_file" class="form-label">Choose a PDF file</label>
                    <input class="form-control" type="file" id="pdf_file" name="pdf_file" accept=".pdf" required>
                </div>

                <div id="file-name" class="text-muted mb-3" style="font-size: 0.9rem;"></div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary btn-lg">Convert to DOCX</button>
                </div>
            </form>

            <div id="preview-container" class="d-none">
                <h5 class="mt-3">📄 PDF Preview:</h5>
                <iframe id="file-preview"></iframe>
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById('pdf_file');
        const fileNameDisplay = document.getElementById('file-name');
        const filePreview = document.getElementById('file-preview');
        const previewContainer = document.getElementById('preview-container');
        const toggleBtn = document.getElementById('toggleTheme');

        input.addEventListener('change', function () {
            const file = input.files[0];
            if (file) {
                fileNameDisplay.textContent = "✅ File Selected: " + file.name;

                const fileURL = URL.createObjectURL(file);
                filePreview.src = fileURL;
                previewContainer.classList.remove("d-none");
            } else {
                fileNameDisplay.textContent = "";
                previewContainer.classList.add("d-none");
            }
        });

        toggleBtn.addEventListener('click', () => {
            const html = document.documentElement;
            const isLight = html.getAttribute('data-bs-theme') === 'light';
            html.setAttribute('data-bs-theme', isLight ? 'dark' : 'light');
            toggleBtn.textContent = isLight ? 'Light Mode' : 'Dark Mode';
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
